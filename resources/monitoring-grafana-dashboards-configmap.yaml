# Edit the dashboard in Grafana, export JSON, paste it here: the next reconcile carries it. Anything not committed is lost on restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: podcd
        folder: ""
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /etc/grafana/provisioning/dashboards
  ai-stack.json: |
    {
      "uid": "ai-stack",
      "title": "AI stack",
      "editable": true,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "schemaVersion": 39,
      "tags": [
        "podcd"
      ],
      "panels": [
        {
          "title": "VRAM used",
          "type": "gauge",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "nvidia_smi_memory_used_bytes / nvidia_smi_memory_total_bytes",
              "legendFormat": "",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "title": "GPU utilisation",
          "type": "timeseries",
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 10,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "nvidia_smi_utilization_gpu_ratio",
              "legendFormat": "compute",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "B",
              "expr": "nvidia_smi_utilization_memory_ratio",
              "legendFormat": "memory bus",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "title": "GPU temperature / power",
          "type": "timeseries",
          "gridPos": {
            "x": 14,
            "y": 0,
            "w": 10,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "nvidia_smi_temperature_gpu",
              "legendFormat": "°C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "B",
              "expr": "nvidia_smi_power_draw_watts",
              "legendFormat": "W",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "title": "Requests / s by model",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 8,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (requested_model) (rate(litellm_requests_metric_total[5m]))",
              "legendFormat": "{{requested_model}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "title": "Tokens / s by model",
          "type": "timeseries",
          "gridPos": {
            "x": 8,
            "y": 5,
            "w": 8,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (requested_model) (rate(litellm_input_tokens_metric_total[5m]))",
              "legendFormat": "in {{requested_model}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "B",
              "expr": "sum by (requested_model) (rate(litellm_output_tokens_metric_total[5m]))",
              "legendFormat": "out {{requested_model}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "title": "Request latency p50 / p95",
          "type": "timeseries",
          "gridPos": {
            "x": 16,
            "y": 5,
            "w": 8,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le, requested_model) (rate(litellm_request_total_latency_metric_bucket[5m])))",
              "legendFormat": "p50 {{requested_model}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le, requested_model) (rate(litellm_request_total_latency_metric_bucket[5m])))",
              "legendFormat": "p95 {{requested_model}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "title": "Container memory",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "podman_container_mem_usage_bytes * on (id) group_left (name) podman_container_info{name!~\".*-(service|infra)\"}",
              "legendFormat": "{{name}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "title": "Container CPU",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(podman_container_cpu_seconds_total[2m]) * on (id) group_left (name) podman_container_info{name!~\".*-(service|infra)\"}",
              "legendFormat": "{{name}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "title": "Logs",
          "type": "logs",
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 24,
            "h": 12
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{container=~\".+\"}",
              "legendFormat": "",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            },
            {
              "refId": "B",
              "expr": "{identifier=\"podcd\"}",
              "legendFormat": "",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        }
      ],
      "templating": {
        "list": []
      }
    }

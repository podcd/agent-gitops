# Values shared by every host in the local environment.
# Referenced from infrastructure/environments/local.yaml.

images:
  ollama: docker.io/ollama/ollama:0.34.2
  openWebui: ghcr.io/open-webui/open-webui:main
  litellm: docker.io/litellm/litellm:v1.101.0
  grafana: docker.io/grafana/grafana:12.4.11
  prometheus: docker.io/prom/prometheus:v3.14.0
  loki: docker.io/grafana/loki:3.7.8
  alloy: docker.io/grafana/alloy:v1.19.2
  gpuExporter: docker.io/utkuozdemir/nvidia_gpu_exporter:1.15.1
  podmanExporter: quay.io/navidys/prometheus-podman-exporter:v2.0.0

# How the GPU is handed to the ollama container.
#   wsl - bind-mount /dev/dxg and /usr/lib/wsl/lib. Works on podman 4.9.3,
#         needs no host package. This is what WSL2 actually exposes.
#   cdi - ask for nvidia.com/gpu=all through resources.limits. Needs
#         nvidia-container-toolkit and a generated /etc/cdi spec; run
#         bootstrap/nvidia-cdi.sh first, and podman new enough to honour it.
#   none - CPU only.
gpu:
  mode: wsl

ollama:
  hostPort: 11434
  # Pulled by the model-puller sidecar once the server answers. `tools`
  # picks the litellm route; see values/values-workstation.yaml for the rule.
  models:
    - name: qwen2.5-coder:7b
      tools: true
  # Unload the model from VRAM after this long idle.
  keepAlive: 30m
  # 8GB VRAM: keep context small or layers spill to CPU.
  contextLength: 8192
  # Only one model resident at a time on an 8GB card.
  maxLoadedModels: 1
  memoryLimit: 8Gi

openWebui:
  hostPort: 3000
  # Single-user box bound to 127.0.0.1. Set true to require a login.
  auth: false
  memoryLimit: 1Gi

litellm:
  hostPort: 4000
  memoryLimit: 1Gi
  # Cloud providers are off until the matching key is in agent.env.
  # Enabling one adds it to the ExternalSecret AND to the proxy config.
  cloud:
    anthropic: false
    openai: false

# One pod: Grafana in front of Prometheus (metrics) and Loki (logs), fed by
# Alloy reading the user journal, a GPU exporter, a podman exporter and
# litellm's own /metrics. Only Grafana and Prometheus get host ports.
monitoring:
  grafana:
    hostPort: 3001
    # Single-user box bound to 127.0.0.1: no login, straight to Admin.
    anonymousAdmin: true
  prometheus:
    hostPort: 9090
    retention: 15d
  loki:
    retention: 168h
  memoryLimit: 2Gi

# Podman network the pods share, declared in infrastructure/networks/ai.yaml
# and created by podcd itself.
network: ai

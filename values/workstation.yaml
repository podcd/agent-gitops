# Host-specific values for `workstation` (DESKTOP-MFTE856).
# Wins over values/common.yaml, per key.
#
# RTX 3070, 8GB VRAM of which ~6.9GB reaches a container, 15GB host RAM
# under WSL2. Full GPU offload is the thing to protect: a handful of layers
# spilling to CPU costs far more throughput than a smaller quant does.

# The podman API socket lives under /run/user/<uid>; the monitoring pod
# mounts it for container metrics. `id -u` on this host.
hostUid: 1003

ollama:
  # `tools` says whether the model's own chat template accepts function
  # definitions - `curl :11434/api/show -d '{"model":...}'` lists it under
  # capabilities. It decides which litellm route the model gets:
  #   true  -> ollama_chat/ : tools passed through natively
  #   false -> ollama/      : litellm emulates tool calls with JSON mode,
  #                           since ollama rejects the request outright
  #                           ("does not support tools") otherwise
  # Emulated tool calling is markedly less reliable than native. An agent
  # that issues a tool call every turn, like Cline, will stumble on it.
  models:
    - name: qwen2.5-coder:7b        # ~4.7GB at Q4_K_M, fits entirely on the card
      tools: true
    - name: deepseek-coder-v2:16b   # the model under test, see below
      tools: false
    - name: MFDoom/deepseek-coder-v2-tool-calling:16b
      tools: true
    # - name: deepseek-coder:6.7b   # ~3.8GB, full offload, weaker than V2, no tools
    #   tools: false
    # - name: deepseek-r1:8b        # ~5.2GB, reasoning-distilled rather than code
    #   tools: true

  # deepseek-coder-v2:16b is ~8.9GB at Q4 against ~6.9GB of usable VRAM, so
  # a good part of it runs on the CPU and it is markedly slower than
  # qwen2.5-coder:7b. That is the cost of testing the strongest DeepSeek
  # this card can hold at all; the 6.7b variant above fits entirely if
  # throughput matters more than capability.
  #
  # The CPU-resident layers come out of the container's memory limit, not
  # the card, so 8Gi is no longer enough to avoid an OOM kill.
  memoryLimit: 12Gi

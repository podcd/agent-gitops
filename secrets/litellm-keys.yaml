# ExternalSecret documents cannot be templates - they are resolved before a
# host's values exist. So each provider gets its own, and the litellm Pod
# template decides which ones it references. A store nobody references is
# never contacted, so the two cloud secrets below cost nothing while their
# provider is off in values.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: litellm-keys
spec:
  secretStoreRef:
    name: local
  target:
    name: litellm-keys
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: LITELLM_MASTER_KEY
---
# Enable with litellm.cloud.anthropic in values, and put ANTHROPIC_API_KEY
# in ~/.config/podcd/agent.env. Until both are done, litellm is held back
# and the other workloads reconcile normally.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: litellm-anthropic
spec:
  secretStoreRef:
    name: local
  target:
    name: litellm-anthropic
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: ANTHROPIC_API_KEY
---
# Enable with litellm.cloud.openai in values, and put OPENAI_API_KEY in
# ~/.config/podcd/agent.env.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: litellm-openai
spec:
  secretStoreRef:
    name: local
  target:
    name: litellm-openai
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: OPENAI_API_KEY

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://localhost:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        url: http://localhost:3100
        editable: false
